# @package _global_
# Push-T base configuration for Diffusion World Model
data:
  dataset:
    name: pusht_expert_train
    val_name: pusht_expert_val
    total_transitions: null
    keys_to_load:
      - pixels
      - action
      - proprio
      - state
    keys_to_cache:
      - action
      - proprio
      - state
    level1:
      frameskip: 5
      num_steps: 4
output_model_name: pusht_dwm
env: pusht
subdir: ${env}/${output_model_name}/seed${seed}
cache_dir: null
run_dir: null
hydra:
  run:
    dir: ${oc.env:HJEPA_HOME,${oc.env:HOME}/.stable_worldmodel}/ckpts/${subdir}/hydra
seed: 42
img_size: 128
num_workers: 8
dump_object: true
save_every_n_epochs: 1
enable_logger: true
trainer:
  max_epochs: 15
  devices: auto
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0
  num_sanity_val_steps: 1
  limit_train_batches: null
  limit_val_batches: null
loader:
  batch_size: 64
  num_workers: ${num_workers}
  drop_last: true
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  shuffle: true
optimizer:
  lr: 2.0e-04
  weight_decay: 0.001
  warmup_ratio: 0.05
vae:
  type: sd_vae
  pretrained_model_name_or_path: stabilityai/sd-vae-ft-mse
  scaling_factor: 0.18215
  freeze: true
  use_posterior_mean: true
  encode_batch_size: 32
  input_is_imagenet_normalized: true
wm:
  history_size: 3
  rollout_n: 1
  action_dim: 2
  action_embed_dim: 384
  use_proprio: true
  proprio_dim: 4
  proprio_loss_weight: 1.0
  proprio_cost_weight: 0.0
  ctx_noise_std: 0.05
  num_ode_steps: 4
  ode_solver: euler
  rollout_mode: parallel
  rollout_noise_scale: 0.0
  action_queue_size: 0
dit:
  patch_size: 2
  hidden_dim: 384
  depth: 6
  heads: 6
  dim_head: 64
  mlp_ratio: 4.0
  dropout: 0.0
  max_seq_len: 32
  use_action_token: true
planning_eval:
  enabled: true
  config_name: pusht_gd
  output_subdir: planning_eval
  run_on_train_end: true
  every_n_epochs: 0
