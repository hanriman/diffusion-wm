[project]
name = "diffusion-wm"
version = "0.1.0"
description = "Pretrained VAE Latent Diffusion World Model (Rectified Flow + Diffusion Forcing DiT) for Push-T and Visual AntMaze"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "diffusers>=0.31.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "huggingface-hub>=0.26.0",
    "numpy<2.3",
    "loguru",
    "tabulate",
    "gymnasium==1.2.3",
    "einops",
    "h5py",
    "scipy",
    "hdf5plugin",
    "tqdm",
    "gdown",
    "typer",
    "rich",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "lightning>=2.4.0",
    "torchmetrics",
    "scikit-learn",
    "matplotlib",
    "pillow",
    "imageio",
]

[project.optional-dependencies]
env = [
    "mujoco==3.14.0",
    "dm_control==1.0.47",
    "pygame",
    "pymunk",
    "shapely",
    "ogbench==1.2.1",
    "minigrid",
    "opencv-python-headless",
    "stable_baselines3",
    "jax",
    "flax",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stable_worldmodel", "diffusion_wm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "diffusion_wm"]
